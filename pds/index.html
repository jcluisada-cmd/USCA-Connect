<!DOCTYPE html>
<!-- CF Pages blob cache-bust 2026-05-22 -->
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#4F46E5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="USCA PdS">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="../manifest.json">
<link rel="apple-touch-icon" href="../icon-512.png">
<title>USCA Connect — Poste de Soins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
    padding-left: env(safe-area-inset-left);
    padding-right: env(safe-area-inset-right);
  }
  /* Dark mode tweaks */
  html.dark .text-indigo-600 { color: #a5b4fc !important; }
  html.dark .bg-indigo-50 { background-color: rgba(79,70,229,0.15) !important; }
  html.dark .border-indigo-200 { border-color: rgba(79,70,229,0.3) !important; }

</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

  <!-- ═══════════════ HEADER ═══════════════ -->
  <header class="bg-indigo-600 text-white shadow-md flex-shrink-0" style="padding-top:env(safe-area-inset-top)">
    <div class="flex items-center gap-2 max-w-6xl mx-auto px-4 py-2.5">
      <span class="text-xl">🏥</span>
      <div class="min-w-0">
        <p class="text-indigo-200 text-[10px] font-medium leading-tight">Poste de Soins</p>
        <h1 class="text-base font-extrabold tracking-tight leading-tight">USCA Pitié-Salpêtrière</h1>
      </div>
      <span id="hdr-clock" class="hidden sm:inline text-indigo-200 text-xs ml-2">--:--</span>
      <div class="ml-auto flex items-center gap-1.5">
        <button id="btn-appel-medecins" class="bg-white text-indigo-600 font-bold text-xs px-3 py-1.5 rounded-lg hover:bg-indigo-50 transition flex items-center gap-1">
          <span>🔔</span><span class="hidden sm:inline">Appeler médecins USCA</span><span class="sm:hidden">Médecins</span>
        </button>
        <button id="btn-theme" title="Mode sombre" class="bg-white/20 hover:bg-white/30 w-8 h-8 rounded-lg flex items-center justify-center transition">🌙</button>
        <button id="btn-logout" title="Déconnexion" class="bg-white/20 hover:bg-white/30 w-8 h-8 rounded-lg flex items-center justify-center transition">⎋</button>
      </div>
    </div>
  </header>

  <!-- ═══════════════ BANDEAU STATS ═══════════════ -->
  <div id="stats-bar" class="bg-white dark:bg-slate-800 border-b border-slate-200 dark:border-slate-700 flex-shrink-0">
    <div class="max-w-6xl mx-auto px-3 py-2 flex flex-wrap gap-1.5 text-xs">
      <span id="stat-cushman" class="px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600">0 Cushman à refaire</span>
      <span id="stat-perm" class="px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600">0 Demande permission</span>
      <span id="stat-absents" class="px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600">0 Absents</span>
      <span id="stat-messages" class="px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600">0 Messages</span>
    </div>
  </div>

  <!-- ═══════════════ MAIN ═══════════════ -->
  <main class="flex-1 max-w-6xl mx-auto w-full px-3 py-4">

    <!-- VUE HOME -->
    <div id="home-view">
      <h2 class="text-lg font-bold mb-2.5">Patients hospitalisés</h2>
      <div id="patients-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 mb-8">
        <p class="col-span-full text-center text-slate-400 py-8">Chargement…</p>
      </div>
    </div>

    <!-- VUE DÉTAIL PATIENT -->
    <div id="detail-view" class="hidden"></div>

  </main>

  <!-- ═══════════════ SCRIPTS ═══════════════ -->
  <script src="../shared/supabase.js"></script>
  <script src="../shared/auth.js"></script>
  <script src="../shared/theme.js"></script>
  <script src="../shared/cushman.js"></script>

  <script>
  // ────────── Helpers ──────────
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
    });
  }

  function jourHospit(dateAdmission) {
    if (!dateAdmission) return '—';
    var d0 = new Date(dateAdmission); d0.setHours(0,0,0,0);
    var dN = new Date(); dN.setHours(0,0,0,0);
    var days = Math.floor((dN - d0) / (24*3600*1000)) + 1;
    return 'J' + Math.max(days, 1);
  }

  function calcAge(ddn) {
    if (!ddn) return '—';
    var diff = Date.now() - new Date(ddn).getTime();
    return Math.floor(diff / (365.25 * 24 * 3600 * 1000));
  }

  function formatReturn(info) {
    if (!info || !info.dateRetour) return 'Retour ?';
    var d = new Date(info.dateRetour + 'T00:00:00');
    var today = new Date(); today.setHours(0,0,0,0);
    var hh = (info.heureRetour || '').slice(0,5).replace(':', 'h');
    if (d.getTime() === today.getTime()) return 'Retour ' + (hh || '?');
    var dm = d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
    return 'Retour ' + dm + (hh ? ' à ' + hh : '');
  }

  function showToast(msg, type) {
    var t = document.createElement('div');
    var bg = type === 'success' ? 'bg-emerald-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
    t.className = 'fixed bottom-4 left-1/2 -translate-x-1/2 ' + bg + ' text-white px-4 py-2 rounded-lg text-sm shadow-lg z-50';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(function(){ t.remove(); }, 3500);
  }

  // ────────── Auth gate ──────────
  (async function() {
    var session = await auth.getStaffSession();
    if (!session || session.role !== 'pds') {
      window.location.href = '../';
      return;
    }
    initApp(session);
  })();

  function initApp(session) {
    document.getElementById('btn-logout').addEventListener('click', async function() {
      await auth.logoutStaff();
      window.location.href = '../';
    });

    document.getElementById('btn-theme').addEventListener('click', function() {
      if (window.theme && typeof window.theme.toggle === 'function') window.theme.toggle();
      else document.documentElement.classList.toggle('dark');
    });

    document.getElementById('btn-appel-medecins').addEventListener('click', appelerMedecins);

    updateClock();
    setInterval(updateClock, 30 * 1000);

    refreshAll();
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) refreshAll();
    });
  }

  function updateClock() {
    var clk = document.getElementById('hdr-clock');
    if (clk) clk.textContent = '· ' + new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
  }

  // ────────── Chargement + render ──────────
  var allPatientsCache = [];

  async function refreshAll() {
    await renderHome();
  }

  async function loadPatients() {
    var r = await sb.from('patients')
      .select('id, numero_chambre, sexe, date_naissance, date_admission, date_sortie_prevue, sortie_info, postcure_statut')
      .order('numero_chambre', { ascending: true });
    if (r.error) { console.error(r.error); return []; }
    return r.data || [];
  }

  async function buildStatesFor(patient) {
    // Dernier Cushman
    var scores = await cushman.getScores(patient.id, 1);
    var lastCushman = scores[0] || null;

    // Permissions
    var pr = await sb.from('permissions').select('*').eq('patient_id', patient.id);
    var perms = pr.data || [];
    var now = new Date();
    var isAway = false, returnInfo = null, permState = null;
    perms.forEach(function(p) {
      if (p.statut === 'en_attente') permState = permState || 'demande';
      if (p.statut === 'validee') {
        try {
          var start = new Date(p.date_debut + 'T' + (p.heure_debut || '00:00') + ':00');
          var end   = new Date((p.date_retour || p.date_debut) + 'T' + (p.heure_retour || '23:59') + ':00');
          if (now >= start && now <= end) {
            isAway = true;
            returnInfo = { dateRetour: p.date_retour || p.date_debut, heureRetour: p.heure_retour };
            permState = 'active';
          }
        } catch(e) { /* date invalide → skip */ }
      }
    });

    // Messages non lus (MVP : messages patient des dernières 24h)
    var since = new Date(Date.now() - 24*3600*1000).toISOString();
    var mr = await sb.from('contenus_partages')
      .select('*', { count: 'exact', head: true })
      .eq('patient_id', patient.id)
      .is('cree_par', null)
      .gt('created_at', since);
    var msgUnread = mr.count || 0;

    return {
      lastCushman: lastCushman,
      isAway: isAway,
      returnInfo: returnInfo,
      notifs: {
        permission: permState,
        cushmanDue: cushman.isOverdue(lastCushman),
        messages: msgUnread
      }
    };
  }

  function renderPatientCardDOM(patient, st) {
    var state = st.isAway ? 'away' : (st.notifs.cushmanDue ? 'urgent' : 'normal');

    var card = document.createElement('div');
    card.className = 'rounded-lg p-2.5 cursor-pointer transition ' + (
      state === 'urgent' ? 'bg-red-50 dark:bg-red-900/30 border border-red-300 dark:border-red-700' :
      state === 'away'   ? 'bg-sky-50 dark:bg-sky-900/30 border border-dashed border-sky-200 dark:border-sky-700' :
                           'bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-indigo-300'
    );
    card.addEventListener('click', function() { ouvrirDetailPatient(patient.id); });

    // Ligne 1 : chambre + meta + bouton/heure retour
    var row = document.createElement('div');
    row.className = 'flex items-center gap-2';

    var pill = document.createElement('span');
    pill.textContent = patient.numero_chambre || '?';
    if (state === 'urgent') {
      pill.className = 'px-2 py-0.5 rounded font-bold text-white bg-red-600 text-sm';
    } else if (state === 'away') {
      pill.className = 'px-2 py-0.5 rounded font-bold bg-white text-sky-600 border-2 border-sky-500 text-sm';
    } else {
      pill.className = 'px-2 py-0.5 rounded font-bold text-white bg-indigo-600 text-sm';
    }
    row.appendChild(pill);

    var meta = document.createElement('div');
    meta.className = 'flex-1 text-xs ' + (state === 'away' ? 'text-sky-800 dark:text-sky-200' : 'text-slate-600 dark:text-slate-400');
    var j = jourHospit(patient.date_admission);
    var sx = patient.sexe || '—';
    var ag = calcAge(patient.date_naissance);
    var strong = document.createElement('strong');
    strong.className = state === 'away' ? 'text-sky-900 dark:text-sky-100' : 'text-slate-900 dark:text-slate-100';
    strong.textContent = j;
    meta.appendChild(strong);
    meta.appendChild(document.createTextNode(' · ' + sx + ' · ' + ag + ' ans'));
    row.appendChild(meta);

    if (state === 'away') {
      var rt = document.createElement('span');
      rt.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded bg-white dark:bg-slate-800 border border-sky-200 dark:border-sky-700 text-sky-700 dark:text-sky-200 text-[11px] font-semibold whitespace-nowrap';
      rt.textContent = '🚶 ' + formatReturn(st.returnInfo);
      row.appendChild(rt);
    } else {
      var btn = document.createElement('button');
      btn.className = 'px-2 py-0.5 rounded bg-indigo-50 dark:bg-indigo-900/40 border border-indigo-200 dark:border-indigo-700 text-indigo-700 dark:text-indigo-200 text-[11px] font-semibold whitespace-nowrap';
      btn.textContent = '🔔 Appeler';
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        appelerPatient(patient.id);
      });
      row.appendChild(btn);
    }
    card.appendChild(row);

    // Ligne 2 : notifs (only if any)
    var notifs = [];
    if (st.notifs.permission === 'demande') {
      notifs.push({ txt: '🚶 Demande', cls: 'bg-amber-100 dark:bg-amber-900/40 text-amber-800 dark:text-amber-200 border border-amber-200 dark:border-amber-700' });
    } else if (st.notifs.permission === 'active' && !st.isAway) {
      notifs.push({ txt: '🚶 En permission', cls: 'bg-sky-100 dark:bg-sky-900/40 text-sky-800 dark:text-sky-200 border border-sky-200 dark:border-sky-700' });
    }
    if (st.notifs.cushmanDue) {
      notifs.push({ txt: '📋 Cushman à refaire', cls: 'bg-red-100 dark:bg-red-900/40 text-red-800 dark:text-red-200 border border-red-200 dark:border-red-700' });
    }
    if (st.notifs.messages > 0) {
      notifs.push({ txt: '💬 ' + st.notifs.messages, cls: 'bg-pink-100 dark:bg-pink-900/40 text-pink-800 dark:text-pink-200 border border-pink-200 dark:border-pink-700' });
    }
    if (state === 'away' && st.notifs.messages > 0) {
      // toujours afficher messages même en permission (couvert ci-dessus)
    }
    if (notifs.length > 0) {
      var nrow = document.createElement('div');
      nrow.className = 'flex flex-wrap gap-1 mt-1.5';
      notifs.forEach(function(n) {
        var pill2 = document.createElement('span');
        pill2.className = 'inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[11px] font-semibold ' + n.cls;
        pill2.textContent = n.txt;
        nrow.appendChild(pill2);
      });
      card.appendChild(nrow);
    }

    return card;
  }

  function renderStats(allStates) {
    var st = {
      cushmanARefaire: allStates.filter(function(s){ return s.notifs.cushmanDue; }).length,
      demandesPerm:    allStates.filter(function(s){ return s.notifs.permission === 'demande'; }).length,
      absents:         allStates.filter(function(s){ return s.isAway; }).length,
      messages:        allStates.reduce(function(sum, s){ return sum + (s.notifs.messages || 0); }, 0)
    };
    var c = document.getElementById('stat-cushman');
    var p = document.getElementById('stat-perm');
    var a = document.getElementById('stat-absents');
    var m = document.getElementById('stat-messages');
    c.textContent = st.cushmanARefaire + ' Cushman à refaire';
    p.textContent = st.demandesPerm + ' Demande' + (st.demandesPerm > 1 ? 's' : '') + ' permission';
    a.textContent = st.absents + ' Absent' + (st.absents > 1 ? 's' : '');
    m.textContent = st.messages + ' Message' + (st.messages > 1 ? 's' : '');

    setStatClass(c, st.cushmanARefaire > 0, 'red');
    setStatClass(p, st.demandesPerm > 0, 'amber');
    setStatClass(a, st.absents > 0, 'sky');
    setStatClass(m, st.messages > 0, 'red');
  }

  function setStatClass(el, active, color) {
    var defaultCls = 'px-2.5 py-1 rounded-md bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600';
    if (!active) { el.className = defaultCls; return; }
    var map = {
      red:   'px-2.5 py-1 rounded-md bg-red-100 dark:bg-red-900/40 border border-red-300 dark:border-red-700 text-red-800 dark:text-red-200 font-semibold',
      amber: 'px-2.5 py-1 rounded-md bg-amber-100 dark:bg-amber-900/40 border border-amber-300 dark:border-amber-700 text-amber-800 dark:text-amber-200 font-semibold',
      sky:   'px-2.5 py-1 rounded-md bg-sky-100 dark:bg-sky-900/40 border border-sky-300 dark:border-sky-700 text-sky-800 dark:text-sky-200 font-semibold'
    };
    el.className = map[color] || defaultCls;
  }

  async function renderHome() {
    var patients = await loadPatients();
    allPatientsCache = patients;
    var grid = document.getElementById('patients-grid');
    grid.replaceChildren();
    if (patients.length === 0) {
      var empty = document.createElement('p');
      empty.className = 'col-span-full text-center text-slate-400 py-8 text-sm';
      empty.textContent = 'Aucun patient hospitalisé.';
      grid.appendChild(empty);
      renderStats([]);
      return;
    }
    var states = await Promise.all(patients.map(function(p){ return buildStatesFor(p); }));
    patients.forEach(function(p, i) {
      grid.appendChild(renderPatientCardDOM(p, states[i]));
    });
    renderStats(states);
  }

  // ────────── Convocations ──────────
  async function appelerMedecins() {
    var r = await sb.from('profiles').select('id').eq('role', 'medecin');
    var medecins = r.data || [];
    if (medecins.length === 0) {
      showToast('Aucun médecin trouvé', 'error');
      return;
    }
    try {
      var profileIds = medecins.map(function(m){ return m.id; });
      var res = await sb.functions.invoke('send-push', {
        body: {
          target_profile_ids: profileIds,
          title: 'Poste de Soins USCA',
          body: 'Le poste de soins vous demande',
          url: '/admin/'
        }
      });
      if (res.error) throw res.error;
      showToast('Notification envoyée à ' + medecins.length + ' médecin(s)', 'success');
    } catch(e) {
      showToast('Erreur push : ' + (e.message || e), 'error');
    }
  }

  async function appelerPatient(patientId) {
    try {
      var sr = await sb.from('push_subscriptions').select('id').eq('patient_id', patientId).limit(1);
      if (!sr.data || sr.data.length === 0) {
        showToast('Patient sans notifications activées', 'error');
        return;
      }
      var res = await sb.functions.invoke('send-push', {
        body: {
          target_patient_id: patientId,
          title: 'USCA',
          body: 'Merci de vous présenter au poste de soins',
          url: '/patient/'
        }
      });
      if (res.error) throw res.error;
      var session = await auth.getStaffSession();
      await sb.from('evenements').insert({
        patient_id: patientId,
        type: 'convocation_pds',
        profile_id: session.id,
        contenu: 'Convocation patient au poste de soins'
      });
      showToast('Patient convoqué', 'success');
    } catch(e) {
      showToast('Erreur : ' + (e.message || e), 'error');
    }
  }

  // ────────── Vue détail patient ──────────

  function ouvrirDetailPatient(patientId) {
    document.getElementById('home-view').classList.add('hidden');
    document.getElementById('detail-view').classList.remove('hidden');
    window.scrollTo(0, 0);
    loadDetail(patientId);
  }

  function retourHome() {
    document.getElementById('detail-view').classList.add('hidden');
    document.getElementById('home-view').classList.remove('hidden');
    refreshAll();
  }

  async function loadDetail(patientId) {
    var dv = document.getElementById('detail-view');
    dv.replaceChildren();
    var loading = document.createElement('p');
    loading.className = 'text-center text-slate-400 py-8';
    loading.textContent = 'Chargement…';
    dv.appendChild(loading);

    var r = await sb.from('patients').select('*').eq('id', patientId).single();
    if (r.error || !r.data) {
      loading.textContent = 'Erreur de chargement du patient.';
      return;
    }
    var patient = r.data;

    dv.replaceChildren();
    buildDetailDOM(patient, dv);
    renderIdentite(patient);
    renderCushmanLeft(patient);
    switchDetailTab('transmissions', patient);
  }

  function buildDetailDOM(patient, container) {
    // Topbar bleu indigo
    var topbar = document.createElement('div');
    topbar.className = 'bg-indigo-600 text-white p-2.5 flex items-center gap-2 rounded-t-xl flex-wrap';

    var back = document.createElement('button');
    back.className = 'px-2 py-1 bg-white/20 hover:bg-white/30 rounded text-sm';
    back.textContent = '← Retour';
    back.addEventListener('click', retourHome);
    topbar.appendChild(back);

    var roomPill = document.createElement('span');
    roomPill.className = 'bg-white text-indigo-600 font-bold px-2 py-0.5 rounded text-sm';
    roomPill.textContent = 'Ch. ' + (patient.numero_chambre || '?');
    topbar.appendChild(roomPill);

    var j = document.createElement('span');
    j.className = 'text-sm font-medium opacity-90';
    j.textContent = jourHospit(patient.date_admission);
    topbar.appendChild(j);

    var callBtn = document.createElement('button');
    callBtn.className = 'ml-auto bg-white text-indigo-600 font-semibold px-3 py-1 rounded text-sm';
    callBtn.textContent = '🔔 Appeler patient';
    callBtn.addEventListener('click', function() { appelerPatient(patient.id); });
    topbar.appendChild(callBtn);

    container.appendChild(topbar);

    // Grille 2 colonnes (tablette) / empilé (mobile)
    var grid = document.createElement('div');
    grid.className = 'grid md:grid-cols-[320px_1fr] gap-3 bg-white dark:bg-slate-800 p-3 rounded-b-xl border border-t-0 border-slate-200 dark:border-slate-700';
    container.appendChild(grid);

    var left = document.createElement('div');
    var identite = document.createElement('div');
    identite.id = 'detail-identite';
    identite.className = 'mb-3';
    var cushmanZone = document.createElement('div');
    cushmanZone.id = 'detail-cushman';
    left.appendChild(identite);
    left.appendChild(cushmanZone);
    grid.appendChild(left);

    var right = document.createElement('div');
    right.id = 'detail-right';

    var tabBar = document.createElement('div');
    tabBar.id = 'detail-tabs';
    tabBar.className = 'flex border-b border-slate-200 dark:border-slate-700 mb-3 flex-wrap';
    ['transmissions','messages','permissions'].forEach(function(name) {
      var btn = document.createElement('button');
      btn.dataset.tab = name;
      btn.className = 'px-3 py-2 text-sm text-slate-500 dark:text-slate-400 border-b-2 border-transparent -mb-px hover:text-slate-700';
      btn.textContent = name.charAt(0).toUpperCase() + name.slice(1);
      btn.addEventListener('click', function() { switchDetailTab(name, patient); });
      tabBar.appendChild(btn);
    });
    right.appendChild(tabBar);

    var tabContent = document.createElement('div');
    tabContent.id = 'detail-tab-content';
    right.appendChild(tabContent);
    grid.appendChild(right);
  }

  function renderIdentite(patient) {
    var container = document.getElementById('detail-identite');
    container.replaceChildren();
    var card = document.createElement('div');
    card.className = 'bg-slate-50 dark:bg-slate-700/50 border border-slate-200 dark:border-slate-600 rounded-lg p-3';

    var title = document.createElement('h4');
    title.className = 'text-[10px] uppercase text-slate-500 dark:text-slate-400 font-semibold tracking-wider mb-2';
    title.textContent = 'Identité';
    card.appendChild(title);

    function makeRow(key, valueNode, isLast) {
      var row = document.createElement('div');
      row.className = 'flex justify-between items-center text-sm py-1' + (isLast ? '' : ' border-b border-dashed border-slate-300 dark:border-slate-600');
      var k = document.createElement('span');
      k.className = 'text-slate-500 dark:text-slate-400';
      k.textContent = key;
      row.appendChild(k);
      row.appendChild(valueNode);
      card.appendChild(row);
    }

    // Chambre + bouton Changer
    var chambreV = document.createElement('span');
    chambreV.className = 'flex items-center gap-2';
    var chambreLbl = document.createElement('span');
    chambreLbl.className = 'font-medium';
    chambreLbl.textContent = patient.numero_chambre || '?';

    chambreBtn.className = 'text-[10px] px-2 py-0.5 bg-amber-500 hover:bg-amber-600 text-white rounded font-semibold';

    chambreV.appendChild(chambreBtn);
    makeRow('Chambre', chambreV, false);

    // Entrée
    var entreeV = document.createElement('span');
    entreeV.className = 'font-medium';
    if (patient.date_admission) {
      var dE = new Date(patient.date_admission);
      entreeV.textContent = dE.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' }) + ' (' + jourHospit(patient.date_admission) + ')';
    } else {
      entreeV.textContent = '—';
    }
    makeRow('Entrée', entreeV, false);

    // Sortie prévue
    var sortieV = document.createElement('span');
    sortieV.className = 'font-medium';
    if (patient.date_sortie_prevue) {
      var dS = new Date(patient.date_sortie_prevue);
      sortieV.textContent = dS.toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit' });
    } else {
      sortieV.textContent = '—';
    }
    makeRow('Sortie prévue', sortieV, false);

    // Type sortie
    var dest = patient.sortie_info && patient.sortie_info.destination;
    var typeV = document.createElement('span');
    if (dest === 'rad') {
      typeV.className = 'inline-block px-2 py-0.5 rounded text-xs font-semibold bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200';
      typeV.textContent = 'RAD';
    } else if (dest === 'postcure') {
      typeV.className = 'inline-block px-2 py-0.5 rounded text-xs font-semibold bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200';
      typeV.textContent = 'Post-cure';
    } else if (dest) {
      typeV.className = 'inline-block px-2 py-0.5 rounded text-xs font-semibold bg-slate-200 text-slate-700 dark:bg-slate-600 dark:text-slate-200';
      typeV.textContent = 'Autre';
    } else {
      typeV.className = 'text-slate-400 text-sm';
      typeV.textContent = '—';
    }
    makeRow('Type sortie', typeV, true);

    container.appendChild(card);
  }

  async function renderCushmanLeft(patient) {

    var last = scores[0] || null;

    var card = document.createElement('div');
    card.className = 'rounded-lg p-3 border ' + (
      last && last.score_total >= 7
        ? 'bg-red-50 dark:bg-red-900/20 border-red-300 dark:border-red-700'
        : 'bg-slate-50 dark:bg-slate-700/50 border-slate-200 dark:border-slate-600'
    );

    title.className = 'text-[10px] uppercase text-slate-500 dark:text-slate-400 font-semibold tracking-wider mb-2';
    title.textContent = 'Cushman';
    card.appendChild(title);

    if (last) {
      var center = document.createElement('div');
      center.className = 'text-center';
      var big = document.createElement('div');
      var col = cushman.colorFor(last.score_total);
      big.className = 'text-5xl font-extrabold ' + (
        col === 'red' ? 'text-red-600 dark:text-red-400' :
        col === 'amber' ? 'text-amber-600 dark:text-amber-400' :
                          'text-emerald-600 dark:text-emerald-400'
      );
      big.textContent = String(last.score_total);
      center.appendChild(big);
      var subt = document.createElement('div');
      subt.className = 'text-xs text-slate-500 dark:text-slate-400';
      subt.textContent = new Date(last.saisi_le).toLocaleString('fr-FR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
      center.appendChild(subt);
      card.appendChild(center);

      if (last.score_total >= 7) {
        var callout = document.createElement('div');
        callout.className = 'mt-2 p-2 rounded bg-red-100 dark:bg-red-900/40 border border-red-300 dark:border-red-700 text-red-800 dark:text-red-200 text-sm font-semibold text-center';

      if (scores.length > 0) {

        var thead = document.createElement('thead');
        var trh = document.createElement('tr');

          th.className = 'text-' + (i === 2 ? 'right' : 'left') + ' py-1 text-slate-500 dark:text-slate-400 font-medium';
          th.textContent = h;
          trh.appendChild(th);
        });
        thead.appendChild(trh);
        table.appendChild(thead);
        var tbody = document.createElement('tbody');
        scores.forEach(function(s) {
          var tr = document.createElement('tr');
          if (s.score_total >= 7) tr.className = 'bg-red-50/50 dark:bg-red-900/10';
          var t1 = document.createElement('td');
          t1.className = 'py-0.5 px-1 border-b border-slate-200 dark:border-slate-700 text-[11px]';
          t1.textContent = new Date(s.saisi_le).toLocaleString('fr-FR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' });
          var t2 = document.createElement('td');
          t2.className = 'py-0.5 px-1 border-b border-slate-200 dark:border-slate-700 text-[11px]';
          t2.textContent = 'PdS';
          var t3 = document.createElement('td');
          var c2 = cushman.colorFor(s.score_total);
          t3.className = 'py-0.5 px-1 border-b border-slate-200 dark:border-slate-700 text-right font-bold ' + (
            c2 === 'red' ? 'text-red-600 dark:text-red-400' :
            c2 === 'amber' ? 'text-amber-600 dark:text-amber-400' :

          t3.textContent = String(s.score_total);
          tr.appendChild(t1); tr.appendChild(t2); tr.appendChild(t3);

      var none = document.createElement('div');

    btnNew.textContent = '+ Nouveau Cushman';
    btnNew.addEventListener('click', function() {
      cushman.openModal(
        { id: patient.id, numero_chambre: patient.numero_chambre },
        function() { renderCushmanLeft(patient); }
      );
    });
    card.appendChild(btnNew);
    container.appendChild(card);
  }

  function switchDetailTab(name, patient) {
    var bar = document.getElementById('detail-tabs');
    if (bar) {
      Array.prototype.forEach.call(bar.querySelectorAll('button'), function(btn) {
        if (btn.dataset.tab === name) {
          btn.className = 'px-3 py-2 text-sm font-semibold text-indigo-600 dark:text-indigo-400 border-b-2 border-indigo-600 -mb-px';
        } else {
          btn.className = 'px-3 py-2 text-sm text-slate-500 dark:text-slate-400 border-b-2 border-transparent -mb-px hover:text-slate-700';

  // Crayon "Modifier / Supprimer" sur ses propres messages soignant (PdS, dark-aware)
  function buildPdsMsgPencil(bubble, txtEl, m, reload) {
    var pencil = document.createElement('button');
    pencil.type = 'button';
    pencil.className = 'text-xs leading-none text-slate-400 hover:text-slate-600 dark:hover:text-slate-200';
    pencil.textContent = '✏️';
    pencil.setAttribute('aria-label', 'Modifier ou supprimer le message');
    var menu = null;
    function closeMenu() { if (menu) { menu.remove(); menu = null; } }
    pencil.addEventListener('click', function(e) {
      e.stopPropagation();
      if (menu) { closeMenu(); return; }
      menu = document.createElement('div');
      menu.className = 'mt-1.5 flex flex-col gap-1 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-600 p-1 shadow-sm';
      var bEdit = document.createElement('button');
      bEdit.type = 'button';
      bEdit.className = 'text-left px-2 py-1 text-xs rounded text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700';
      bEdit.textContent = 'Modifier le message';
      bEdit.addEventListener('click', function(ev) { ev.stopPropagation(); closeMenu(); startEdit(); });
      var bDel = document.createElement('button');
      bDel.type = 'button';
      bDel.className = 'text-left px-2 py-1 text-xs rounded font-semibold text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/30';
      bDel.textContent = 'Supprimer le message';
      bDel.addEventListener('click', async function(ev) {
        ev.stopPropagation(); closeMenu();
        if (!confirm('Supprimer ce message ? Cette action est définitive.')) return;
        try {
          var res = await sb.from('contenus_partages').delete().eq('id', m.id);
          if (res.error) throw res.error;
          reload();
        } catch(err) { showToast('Erreur : ' + (err.message || err), 'error'); }
      });
      menu.appendChild(bEdit); menu.appendChild(bDel);
      bubble.appendChild(menu);
    });
    function startEdit() {
      txtEl.classList.add('hidden');
      var box = document.createElement('div');
      box.className = 'mt-1';
      var ta = document.createElement('textarea');
      ta.className = 'w-full text-sm text-slate-800 dark:text-slate-100 bg-white dark:bg-slate-700 rounded-lg border border-slate-300 dark:border-slate-600 p-2 resize-none';
      ta.rows = 3; ta.value = String(m.contenu || '');
      var actions = document.createElement('div');
      actions.className = 'flex gap-2 mt-1 justify-end';
      var cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.className = 'px-3 py-1 text-xs font-semibold rounded-lg bg-slate-200 dark:bg-slate-600 text-slate-700 dark:text-slate-100';
      cancel.textContent = 'Annuler';
      cancel.addEventListener('click', function() { reload(); });
      var save = document.createElement('button');
      save.type = 'button';
      save.className = 'px-3 py-1 text-xs font-semibold rounded-lg bg-indigo-600 text-white';
      save.textContent = 'Valider';
      save.addEventListener('click', async function() {
        var val = ta.value.trim(); if (!val) return;
        save.disabled = true;
        try {
          var res = await sb.from('contenus_partages').update({ contenu: val, modifie_le: new Date().toISOString() }).eq('id', m.id);
          if (res.error) throw res.error;
          reload();
        } catch(err) { showToast('Erreur : ' + (err.message || err), 'error'); save.disabled = false; }
      });
      actions.appendChild(cancel); actions.appendChild(save);
      box.appendChild(ta); box.appendChild(actions);
      bubble.appendChild(box);
      ta.focus();
    }
    return pencil;
  }

  async function renderTabMessages(patient, container) {
    var r = await sb.from('contenus_partages')
      .select('*, profiles!cree_par(email)').eq('patient_id', patient.id)
      .order('created_at', { ascending: true });
    var msgs = r.data || [];
    var session = await auth.getStaffSession();

    var list = document.createElement('div');
    list.className = 'space-y-2 max-h-96 overflow-y-auto p-1';
    if (msgs.length === 0) {
      var none = document.createElement('div');
      none.className = 'text-center text-slate-400 py-8 text-sm';
      none.textContent = 'Aucun message';
      list.appendChild(none);
    } else {
      msgs.forEach(function(m) {
        var isPatient = m.cree_par === null;
        var wrap = document.createElement('div');
        wrap.className = 'flex ' + (isPatient ? 'justify-start' : 'justify-end');
        var bubble = document.createElement('div');
        bubble.className = 'max-w-[75%] rounded-lg p-2 ' + (
          isPatient ? 'bg-slate-100 dark:bg-slate-700' : 'bg-indigo-100 dark:bg-indigo-900/40'
        );
        var ts = document.createElement('div');
        ts.className = 'text-[10px] text-slate-500 dark:text-slate-400 mb-1';
        var who;
        if (isPatient) {
          who = ' · Patient';
        } else {
          var email = m.profiles && m.profiles.email;
          who = email ? (' · ' + email.split('@')[0]) : ' · Soignant';
        }
        ts.textContent = new Date(m.created_at).toLocaleString('fr-FR', { hour:'2-digit', minute:'2-digit', day:'2-digit', month:'2-digit' }) + who + (m.modifie_le ? ' (modifié)' : '');
        var txt = document.createElement('div');
        txt.className = 'text-sm';
        txt.textContent = String(m.contenu || '');
        bubble.appendChild(ts);
        bubble.appendChild(txt);
        // Crayon uniquement sur ses propres messages soignant (compte PdS partagé)
        if (!isPatient && session && m.cree_par === session.id) {
          var foot = document.createElement('div');
          foot.className = 'flex justify-end mt-1';
          foot.appendChild(buildPdsMsgPencil(bubble, txt, m, function() { container.replaceChildren(); return renderTabMessages(patient, container); }));
          bubble.appendChild(foot);
        }
        wrap.appendChild(bubble);
        list.appendChild(wrap);
      });
    }
    container.appendChild(list);

    var form = document.createElement('div');
    form.className = 'mt-3 flex gap-2';
    var inp = document.createElement('input');
    inp.type = 'text';
    inp.placeholder = 'Envoyer un message au patient...';
    inp.className = 'flex-1 px-3 py-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded text-sm';
    var btn = document.createElement('button');
    btn.className = 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold text-sm';
    btn.textContent = 'Envoyer';
    async function sendMessage() {
      var contenu = inp.value.trim();
      if (!contenu) return;
      btn.disabled = true;
      try {
        var session = await auth.getStaffSession();
        var res = await sb.from('contenus_partages').insert({
          patient_id: patient.id, contenu: contenu, cree_par: session.id
        });
        if (res.error) throw res.error;
        inp.value = '';
        container.replaceChildren();
        renderTabMessages(patient, container);
      } catch(e) {
        showToast('Erreur : ' + (e.message || e), 'error');
      } finally {
        btn.disabled = false;
      }
    }
    btn.addEventListener('click', sendMessage);
    inp.addEventListener('keydown', function(e) { if (e.key === 'Enter') sendMessage(); });
    form.appendChild(inp);
    form.appendChild(btn);
    container.appendChild(form);
  }

  async function renderTabPermissions(patient, container) {
    var r = await sb.from('permissions')
      .select('*').eq('patient_id', patient.id)
      .order('date_debut', { ascending: false });
    var perms = r.data || [];

    if (perms.length === 0) {
      var none = document.createElement('div');
      none.className = 'text-center text-slate-400 py-8 text-sm';
      none.textContent = 'Aucune permission';
      container.appendChild(none);
      return;
    }

    perms.forEach(function(p) {
      var frame, badge;
      if (p.statut === 'en_attente') {
        frame = 'bg-amber-50 dark:bg-amber-900/20 border-amber-300 dark:border-amber-700';
        badge = { txt: '🚶 Demande en attente', cls: 'bg-amber-100 text-amber-800 dark:bg-amber-900/40 dark:text-amber-200' };
      } else if (p.statut === 'validee') {
        frame = 'bg-emerald-50 dark:bg-emerald-900/20 border-emerald-300 dark:border-emerald-700';
        badge = { txt: '✓ Validée', cls: 'bg-emerald-100 text-emerald-800 dark:bg-emerald-900/40 dark:text-emerald-200' };
      } else {
        frame = 'bg-red-50 dark:bg-red-900/20 border-red-300 dark:border-red-700';
        badge = { txt: '✗ Refusée', cls: 'bg-red-100 text-red-800 dark:bg-red-900/40 dark:text-red-200' };
      }
      var item = document.createElement('div');
      item.className = 'border rounded-lg p-3 mb-2 ' + frame;

      var head = document.createElement('div');
      head.className = 'flex items-center gap-2 flex-wrap';
      var bspan = document.createElement('span');
      bspan.className = 'px-2 py-0.5 rounded text-xs font-semibold ' + badge.cls;
      bspan.textContent = badge.txt;
      head.appendChild(bspan);
      var ts = document.createElement('span');
      ts.className = 'text-xs text-slate-500 dark:text-slate-400';
      var start = (p.date_debut || '') + (p.heure_debut ? ' ' + p.heure_debut : '');
      var end = (p.date_retour || '') + (p.heure_retour ? ' ' + p.heure_retour : '');
      ts.textContent = start + (end ? ' → ' + end : '');
      head.appendChild(ts);
      item.appendChild(head);

      if (p.motif) {
        var motif = document.createElement('div');
        motif.className = 'text-sm mt-1';
        motif.textContent = 'Motif : ' + p.motif;

      if (p.statut === 'en_attente') {

        flow.className = 'mt-2 text-xs text-amber-700 dark:text-amber-200';
        flow.textContent = 'Patient → PdS (voit) → Médecin (à valider)';

        var refus = document.createElement('div');
        refus.className = 'text-sm mt-1';
        refus.textContent = 'Motif refus : ' + p.motif_refus_libre;
        item.appendChild(refus);
      }
      container.appendChild(item);
    });
  }

  function ouvrirModalChangerChambre(patient) {
    var overlay = document.createElement('div');
    overlay.className = 'fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4';

    var modal = document.createElement('div');
    modal.className = 'bg-white dark:bg-slate-800 rounded-xl max-w-sm w-full p-5';

    var title = document.createElement('h3');
    title.className = 'text-lg font-bold mb-1';
    title.textContent = 'Changer la chambre';
    modal.appendChild(title);

    var help = document.createElement('p');
    help.className = 'text-xs text-slate-500 dark:text-slate-400 mb-3';
    help.textContent = 'Le patient ne sera pas déconnecté. Sa session reste valide. Il verra sa nouvelle chambre via un bandeau in-app au prochain refresh.';
    modal.appendChild(help);

    var lab = document.createElement('label');
    lab.className = 'block text-[10px] uppercase text-slate-500 font-semibold tracking-wider mb-1';
    lab.textContent = 'Nouvelle chambre';
    modal.appendChild(lab);

    var input = document.createElement('input');
    input.type = 'text';
    input.value = patient.numero_chambre || '';
    input.className = 'w-full p-2 border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-700 rounded text-sm mb-3';
    modal.appendChild(input);

    var btns = document.createElement('div');
    btns.className = 'flex gap-2 justify-end';
    var btnCancel = document.createElement('button');
    btnCancel.className = 'px-4 py-2 bg-slate-200 dark:bg-slate-700 text-slate-700 dark:text-slate-200 rounded';
    btnCancel.textContent = 'Annuler';
    btnCancel.addEventListener('click', function() { overlay.remove(); });
    var btnConfirm = document.createElement('button');
    btnConfirm.className = 'px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded font-semibold';
    btnConfirm.textContent = 'Confirmer';
    btnConfirm.addEventListener('click', async function() {
      var newRoom = input.value.trim();
      if (!newRoom || newRoom === patient.numero_chambre) {
        overlay.remove();
        return;
      }
      btnConfirm.disabled = true;
      btnConfirm.textContent = '…';
      try {
        var res = await sb.from('patients').update({ numero_chambre: newRoom }).eq('id', patient.id);
        if (res.error) throw res.error;
        overlay.remove();
        var oldRoom = patient.numero_chambre;
        patient.numero_chambre = newRoom;
        showToast('Chambre changée : ' + oldRoom + ' → ' + newRoom, 'success');
        loadDetail(patient.id);
      } catch(e) {
        btnConfirm.disabled = false;
        btnConfirm.textContent = 'Confirmer';
        showToast('Erreur : ' + (e.message || e), 'error');
      }
    });
    btns.appendChild(btnCancel);
    btns.appendChild(btnConfirm);
    modal.appendChild(btns);

    overlay.appendChild(modal);
    document.body.appendChild(overlay);
    input.focus();
    input.select();
  }

  </script>
</body>
</html>
